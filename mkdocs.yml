site_name: SatDump for Mere Mortals
site_description: A satellite data processor that turns radio recordings into weather images and data. Decoding a real NOAA weather satellite pass end to end, the pipeline catalogue counted from the program's own files, projections and orbital data, and live reception, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/satdump-for-mere-mortals/
copyright: 'Part of <a href="https://paulsullivan33-dev.github.io/mere-mortals/">For Mere Mortals</a> · Text CC BY 4.0, code MIT'

